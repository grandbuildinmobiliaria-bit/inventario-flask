<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de trabajadores</title>
    <link rel="icon" href="{{ url_for('static', filename='mi_icono.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        .map-layout { display:grid; grid-template-columns: minmax(0, 1fr) 360px; gap:14px; }
        #map { height:650px; min-height:650px; width:100%; border-radius:12px; border:1px solid var(--border); box-shadow:var(--shadow); overflow:hidden; z-index:1; }
        .panel { padding:16px; max-height:650px; overflow:auto; }
        .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
        .hint { color:var(--muted); margin-top:0; }
        .worker-card { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--surface-soft); }
        .worker-card h3 { margin:0 0 6px; font-size:1rem; }
        .worker-card p { margin:4px 0; font-size:14px; }
        .distance { font-weight:700; color:var(--primary); }
        .popup-photo { width:82px; height:82px; object-fit:cover; border-radius:10px; display:block; margin-bottom:8px; }
        .popup-actions, .worker-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
        .popup-actions a, .worker-actions a { color:#fff !important; text-decoration:none; background:var(--primary); padding:6px 8px; border-radius:8px; font-weight:600; }
        .popup-actions .whatsapp, .worker-actions .whatsapp { background:#16a34a; }
        .project-pin { align-items:center; background:#f97316; border:2px solid #fff; border-radius:999px; box-shadow:0 2px 8px rgba(0,0,0,.35); color:#fff; display:flex; font-size:13px; height:28px; justify-content:center; width:28px; }
        .legend { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0 12px; }
        .legend span { align-items:center; display:inline-flex; gap:6px; font-size:13px; }
        .dot { border-radius:999px; display:inline-block; height:12px; width:12px; }
        .dot-worker { background:#2563eb; }
        .dot-project { background:#f97316; }
        .leaflet-tile { max-width:none !important; max-height:none !important; }
        .leaflet-marker-icon { max-width:none !important; }
        @media (max-width: 900px) { .map-layout { grid-template-columns:1fr; } #map { height:420px; min-height:420px; } .panel { max-height:none; } }
    </style>
</head>
<body>
<div class="page">
    <div class="top">
        <div>
            <h1>🗺️ Mapa interactivo de trabajadores</h1>
            <p class="hint">Haz clic en una obra o local para ordenar al personal por cercanía. La ubicación usa el centroide del distrito registrado.</p>
        </div>
        <div>
            <button type="button" class="theme-toggle" data-theme-toggle></button>
            <a href="{{ url_for('home') }}" class="boton" style="background:#95a5a6;">🏠 Inicio</a>
        </div>
    </div>

    <section class="map-layout">
        <div id="map"></div>
        <aside class="card panel">
            <h2>Trabajadores cercanos</h2>
            <p id="summary" class="hint">Selecciona un punto en el mapa o un proyecto activo para calcular distancias.</p>
            <div class="legend"><span><i class="dot dot-worker"></i>Trabajador</span><span><i class="dot dot-project"></i>Proyecto</span></div>
            <div id="worker-list"></div>
        </aside>
    </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script>
let map;
let referenceMarker = null;
let trabajadores = [];
let proyectos = [];
const workerList = document.getElementById('worker-list');
const summary = document.getElementById('summary');
const limaCenter = [-12.0464, -77.0428];
const limaBounds = [[-12.55, -77.25], [-11.65, -76.65]];

window.addEventListener('load', () => {
    map = L.map('map').setView(limaCenter, 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    setTimeout(() => {
        map.invalidateSize(true);
        map.setView(limaCenter, 11);
        map.setMaxBounds(limaBounds);
        map.options.maxBoundsViscosity = 0.8;
    }, 250);

    cargarTrabajadores();
    cargarProyectos();
    configurarClicMapa();
});

function haversineKm(lat1, lng1, lat2, lng2) {
    const radioTierraKm = 6371;
    const toRad = value => value * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) ** 2;
    return 2 * radioTierraKm * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatSalario(salario) {
    const monto = Number(salario || 0);
    return `S/ ${monto.toFixed(2)}`;
}

function accionesTrabajador(t) {
    const whatsapp = t.whatsapp_url ? `<a class="whatsapp" href="${t.whatsapp_url}" target="_blank" rel="noopener">WhatsApp</a>` : '';
    return `<div class="popup-actions">${whatsapp}<a href="${t.editar_url}">Añadir a proyecto</a></div>`;
}

function popupTrabajadorHtml(t) {
    const foto = t.foto_url ? `<img class="popup-photo" src="${t.foto_url}" alt="Foto de ${t.nombre}">` : '';
    return `
        <div>
            ${foto}
            <strong>${t.nombre}</strong><br>
            <span>${t.puesto || 'Sin cargo'}</span><br>
            <span>📍 ${t.distrito}</span><br>
            <span>📞 ${t.contacto || 'Sin teléfono'}</span><br>
            <span>💵 ${formatSalario(t.salario)}</span>
            ${accionesTrabajador(t)}
        </div>`;
}

function popupProyectoHtml(p) {
    return `
        <div>
            <strong>🏗️ ${p.nombre}</strong><br>
            <span>Código: ${p.codigo}</span><br>
            <span>Cliente: ${p.cliente || 'Sin cliente'}</span><br>
            <span>📍 ${p.distrito}</span><br>
            <span>Estado: ${p.estado}</span>
            <div class="popup-actions">
                <a href="#" onclick="usarProyectoReferencia('${p.codigo}'); return false;">Usar como referencia</a>
                <a href="${p.editar_url}">Editar ubicación</a>
            </div>
        </div>`;
}

function renderList(items) {
    workerList.innerHTML = items.map(t => {
        const whatsapp = t.whatsapp_url ? `<a class="whatsapp" href="${t.whatsapp_url}" target="_blank" rel="noopener">WhatsApp</a>` : '';
        return `
        <article class="worker-card">
            <h3>${t.nombre}</h3>
            <p class="distance">${t.distanciaKm.toFixed(2)} km</p>
            <p>📍 ${t.distrito}</p>
            <p>🧰 ${t.puesto || 'Sin cargo'}</p>
            <p>🎂 Edad: ${t.edad ?? 'No registrada'}</p>
            <p>💵 ${formatSalario(t.salario)}</p>
            <p>📞 ${t.contacto || 'Sin contacto'}</p>
            <div class="worker-actions">${whatsapp}<a href="${t.editar_url}">Añadir a proyecto</a></div>
        </article>`;
    }).join('') || '<p>No hay trabajadores con distrito reconocido.</p>';
}

function cargarTrabajadores() {
    fetch('{{ url_for('api_trabajadores_mapa') }}')
        .then(response => {
            if (!response.ok) throw new Error('No se pudo cargar el personal del mapa');
            return response.json();
        })
        .then(data => {
            trabajadores = data;
            trabajadores.forEach(t => {
                L.circleMarker([t.lat, t.lng], {
                    radius: 7,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: '#2563eb',
                    fillOpacity: 0.9
                }).addTo(map).bindPopup(popupTrabajadorHtml(t));
            });
            actualizarResumen();
        })
        .catch(error => {
            summary.textContent = error.message;
        });
}

function cargarProyectos() {
    fetch('{{ url_for('api_proyectos_mapa') }}')
        .then(response => {
            if (!response.ok) throw new Error('No se pudo cargar los proyectos del mapa');
            return response.json();
        })
        .then(data => {
            proyectos = data;
            const projectIcon = L.divIcon({
                className: '',
                html: '<div class="project-pin">🏗️</div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -14]
            });
            proyectos.forEach(p => {
                L.marker([p.lat, p.lng], { icon: projectIcon })
                    .addTo(map)
                    .bindPopup(popupProyectoHtml(p));
            });
            actualizarResumen();
        })
        .catch(error => {
            summary.textContent = error.message;
        });
}

function actualizarResumen() {
    summary.textContent = `${trabajadores.length} trabajadores y ${proyectos.length} proyectos ubicados. Haz clic en el mapa o en un proyecto para ordenar por cercanía.`;
}

function ordenarDesde(lat, lng, etiqueta) {
    if (referenceMarker) {
        referenceMarker.setLatLng([lat, lng]);
    } else {
        referenceMarker = L.circleMarker([lat, lng], { radius: 9, color: '#dc2626', weight: 3, fillColor: '#fef2f2', fillOpacity: 0.9 }).addTo(map);
    }
    referenceMarker.bindPopup(etiqueta).openPopup();

    const ordenados = trabajadores
        .map(t => ({ ...t, distanciaKm: haversineKm(lat, lng, t.lat, t.lng) }))
        .sort((a, b) => a.distanciaKm - b.distanciaKm);

    summary.textContent = `Distancias calculadas desde ${etiqueta}.`;
    renderList(ordenados);
}

function usarProyectoReferencia(codigo) {
    const proyecto = proyectos.find(p => p.codigo === codigo);
    if (!proyecto) return;
    ordenarDesde(proyecto.lat, proyecto.lng, `proyecto ${proyecto.codigo} - ${proyecto.nombre}`);
}

function configurarClicMapa() {
    map.on('click', event => {
        const { lat, lng } = event.latlng;
        ordenarDesde(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    });
}
</script>
</body>
</html>
