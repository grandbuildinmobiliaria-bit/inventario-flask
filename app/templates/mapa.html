<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de trabajadores</title>
    <link rel="icon" href="{{ url_for('static', filename='mi_icono.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQqnhgqSMRb0qYEWfSsjhncIIhNh6k=" crossorigin="">
    <style>
        .map-layout { display:grid; grid-template-columns: minmax(0, 1fr) 360px; gap:14px; }
        #map { min-height: 650px; border-radius:12px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .panel { padding:16px; max-height:650px; overflow:auto; }
        .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
        .hint { color:var(--muted); margin-top:0; }
        .worker-card { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--surface-soft); }
        .worker-card h3 { margin:0 0 6px; font-size:1rem; }
        .worker-card p { margin:4px 0; font-size:14px; }
        .distance { font-weight:700; color:var(--primary); }
        .popup-photo { width:82px; height:82px; object-fit:cover; border-radius:10px; display:block; margin-bottom:8px; }
        .popup-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
        .popup-actions a { color:#fff !important; text-decoration:none; background:var(--primary); padding:6px 8px; border-radius:8px; font-weight:600; }
        @media (max-width: 900px) { .map-layout { grid-template-columns:1fr; } #map { min-height:420px; } .panel { max-height:none; } }
    </style>
</head>
<body>
<div class="page">
    <div class="top">
        <div>
            <h1>🗺️ Mapa interactivo de trabajadores</h1>
            <p class="hint">Haz clic en una obra o local para ordenar al personal por cercanía. La ubicación usa el centroide del distrito registrado.</p>
        </div>
        <div>
            <button type="button" class="theme-toggle" data-theme-toggle></button>
            <a href="{{ url_for('home') }}" class="boton" style="background:#95a5a6;">🏠 Inicio</a>
        </div>
    </div>

    <section class="map-layout">
        <div id="map"></div>
        <aside class="card panel">
            <h2>Trabajadores cercanos</h2>
            <p id="summary" class="hint">Selecciona un punto en el mapa para calcular distancias.</p>
            <div id="worker-list"></div>
        </aside>
    </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script>
const map = L.map('map').setView([-12.0464, -77.0428], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let referenceMarker = null;
let trabajadores = [];
const workerList = document.getElementById('worker-list');
const summary = document.getElementById('summary');

function haversineKm(lat1, lng1, lat2, lng2) {
    const radioTierraKm = 6371;
    const toRad = value => value * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) ** 2;
    return 2 * radioTierraKm * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatSalario(salario) {
    const monto = Number(salario || 0);
    return `S/ ${monto.toFixed(2)}`;
}

function popupHtml(t) {
    const foto = t.foto_url ? `<img class="popup-photo" src="${t.foto_url}" alt="Foto de ${t.nombre}">` : '';
    return `
        <div>
            ${foto}
            <strong>${t.nombre}</strong><br>
            <span>${t.puesto || 'Sin cargo'}</span><br>
            <span>📍 ${t.distrito}</span><br>
            <span>📞 ${t.contacto || 'Sin teléfono'}</span><br>
            <span>💵 ${formatSalario(t.salario)}</span>
            <div class="popup-actions">
                <a href="${t.editar_url}">Añadir a proyecto</a>
            </div>
        </div>`;
}

function renderList(items) {
    workerList.innerHTML = items.map(t => `
        <article class="worker-card">
            <h3>${t.nombre}</h3>
            <p class="distance">${t.distanciaKm.toFixed(2)} km</p>
            <p>📍 ${t.distrito}</p>
            <p>🧰 ${t.puesto || 'Sin cargo'}</p>
            <p>🎂 Edad: ${t.edad ?? 'No registrada'}</p>
            <p>💵 ${formatSalario(t.salario)}</p>
            <p>📞 ${t.contacto || 'Sin contacto'}</p>
        </article>`).join('') || '<p>No hay trabajadores con distrito reconocido.</p>';
}

fetch('{{ url_for('api_trabajadores_mapa') }}')
    .then(response => {
        if (!response.ok) throw new Error('No se pudo cargar el personal del mapa');
        return response.json();
    })
    .then(data => {
        trabajadores = data;
        trabajadores.forEach(t => L.marker([t.lat, t.lng]).addTo(map).bindPopup(popupHtml(t)));
        summary.textContent = `${trabajadores.length} trabajadores ubicados por distrito. Haz clic en el mapa para ordenar por distancia.`;
    })
    .catch(error => {
        summary.textContent = error.message;
    });

map.on('click', event => {
    const { lat, lng } = event.latlng;
    if (referenceMarker) {
        referenceMarker.setLatLng(event.latlng);
    } else {
        referenceMarker = L.marker(event.latlng).addTo(map);
    }
    referenceMarker.bindPopup('Punto de referencia').openPopup();

    const ordenados = trabajadores
        .map(t => ({ ...t, distanciaKm: haversineKm(lat, lng, t.lat, t.lng) }))
        .sort((a, b) => a.distanciaKm - b.distanciaKm);

    summary.textContent = `Distancias calculadas desde ${lat.toFixed(5)}, ${lng.toFixed(5)}.`;
    renderList(ordenados);
});
</script>
</body>
</html>
